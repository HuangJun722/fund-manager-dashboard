name: Update Asset Cockpit Quotes

concurrency:
  group: asset-cockpit-pages
  cancel-in-progress: true

on:
  schedule:
    # 每天 18:30（北京时间）抓一次行情
    - cron: "30 10 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/*.js"
      - "config/*.json"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync quotes
        run: node scripts/sync_quotes.js

      - name: Verify output
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "ERROR: docs/index.html missing"
            exit 1
          fi
          if [ ! -f "docs/data/quotes.json" ]; then
            echo "ERROR: docs/data/quotes.json missing"
            exit 1
          fi
          SIZE=$(wc -c < docs/index.html)
          echo "HTML size: $SIZE bytes"
          if [ "$SIZE" -lt 5000 ]; then
            echo "ERROR: docs/index.html is too small"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/quotes.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update quotes $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push
          fi
